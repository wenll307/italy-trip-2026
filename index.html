<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b32"><title>Italy Trip 2026 · 共享行程</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20302b;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}header{background:#173b32;color:white;padding:22px 18px 18px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#d1e3db;font-size:13px}.wrap{max-width:850px;margin:auto;padding:16px 14px 90px}.panel,.item{background:#fff;border:1px solid #e4e6e0;border-radius:15px;padding:16px;margin:0 0 13px;box-shadow:0 2px 8px #152c2010}.muted{color:#63736d;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.days{display:flex;gap:8px;overflow:auto;padding:3px 0 13px}.day{flex:0 0 auto;min-width:65px}.day.active{background:#173b32;color:#fff}button{border:1px solid #ccd6cf;background:#fff;color:#173b32;border-radius:10px;padding:10px 13px;font-weight:600;cursor:pointer}button.primary{background:#173b32;color:white;border-color:#173b32}button.danger{color:#a62c2c;border-color:#f0c5c5}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{display:block;width:100%;padding:11px;border:1px solid #cbd3cd;border-radius:9px;background:#fff;font:inherit;margin:5px 0 12px}textarea{min-height:72px;resize:vertical}label{display:block;font-size:13px;font-weight:600}h2{font-size:19px;margin:0 0 10px}h3{font-size:17px;margin:0 0 6px;overflow-wrap:anywhere}.time{font-weight:700;color:#27584a}.chip{background:#ecf4ef;border-radius:7px;padding:4px 7px;font-size:12px;color:#2c6251}.detail{white-space:pre-wrap;overflow-wrap:anywhere;margin:9px 0;font-size:14px;line-height:1.6}.detail b{color:#3c554a}#notice{white-space:pre-wrap;line-height:1.5}#notice.error{color:#a12a2a}#notice.ok{color:#266746}.hidden{display:none!important}.actions{margin-top:12px}.toolbar{margin:12px 0}.login{max-width:460px;margin:20px auto}.empty{text-align:center;padding:30px;color:#6a7970}a{color:#216d57}.small{font-size:12px}#editor{border:2px solid #8aafa0}hr{border:0;border-top:1px solid #e4e6e0;margin:15px 0}
</style></head><body>
<header><div style="max-width:850px;margin:auto"><h1>🇮🇹 Italy Trip 2026</h1><p>12月14–22日 · 三人共享行程 · V1.7</p></div></header>
<main class="wrap"><div id="notice" class="panel muted">正在初始化…</div>
<section id="login" class="panel login hidden"><h2>旅行成员登录</h2><p class="muted">请使用在 Supabase 创建的 Email 和密码。此版本只允许已加入旅行的成员查看行程。</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit" id="loginBtn">登录</button></form><hr><button id="resetBtn" type="button">忘记密码？发送重设邮件</button><p class="muted small">重设邮件需要 Supabase Authentication → URL Configuration 正确设置 Site URL / Redirect URLs。</p></section>
<section id="recovery" class="panel login hidden"><h2>设置新密码</h2><p class="muted">通过邮箱里的重设链接打开此页面后，在这里设置新密码。</p><form id="recoveryForm"><label>新密码（至少8位）<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary" type="submit">保存新密码</button></form></section>
<section id="app" class="hidden"><div class="panel"><div class="row spread"><div><b id="userEmail"></b><div id="userRole" class="muted"></div></div><button id="logoutBtn">退出登录</button></div><p class="muted small">在线修改会写入 Supabase。离线时仅可查看本机上次成功加载的行程，不支持离线编辑。</p><div class="row"><button id="refreshBtn">↻ 重新同步</button><button id="exportBtn">↓ 导出 JSON 备份</button></div></div><div class="days" id="days"></div><div class="row spread toolbar"><h2 id="dayTitle"></h2><button class="primary" id="addBtn">＋ 新增活动</button></div><div id="items"></div>
<section id="editor" class="panel hidden"><div class="row spread"><h2 id="editorTitle">编辑活动</h2><button type="button" id="cancelBtn">取消</button></div><form id="itemForm"><input type="hidden" id="itemId"><label>日期<input id="fDate" type="date" min="2026-12-14" max="2026-12-22" required></label><label>时间（可写时间范围和备注）<input id="fTime" placeholder="09:00–10:30"></label><label>活动名称（可留空）<input id="fTitle" placeholder="例如：喝咖啡 / 自由活动"></label><label>地区<input id="fArea"></label><label>景点介绍<textarea id="fDescription"></textarea></label><label>当地美食 / 餐厅<textarea id="fFood"></textarea></label><label>交通 / 车站 / 停车<textarea id="fTransport"></textarea></label><label>缓冲时间<textarea id="fBuffer"></textarea></label><label>营业及确认状态<textarea id="fStatus"></textarea></label><label>优先级<select id="fPriority"><option value="">未设置</option><option>必做</option><option>必去</option><option>必吃</option><option>推荐</option><option>可选</option></select></label><label>额外备注<textarea id="fNotes"></textarea></label><button class="primary" type="submit" id="saveBtn">保存到共享行程</button></form></section>
</section></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Project URL 必须是根网址，不能带 /rest/v1/
const SUPABASE_URL='https://vmelgbmmugajivsjznuh.supabase.co';
const SUPABASE_KEY='sb_publishable_u2gEolh073wmY6rCeISHgA_T65YMzFr';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const dates=Array.from({length:9},(_,i)=>`2026-12-${String(14+i).padStart(2,'0')}`);
const cacheKey='italy_trip_2026_v17_shared_cache';
let trip=null,member=null,items=[],selected=dates[0],busy=false,loadSequence=0,recovering=false;
function notice(s,type=''){ $('notice').textContent=s;$('notice').className='panel '+(type||'muted'); }
function errorText(e){return e?.message||String(e)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toggle(id,on){$(id).classList.toggle('hidden',!on)}
function formatDate(d){return `${Number(d.slice(-2))}日 · ${['周一','周二','周三','周四','周五','周六','周日'][(new Date(d+'T12:00:00').getDay()+6)%7]}`}
function sortItems(a,b){return a.day_date.localeCompare(b.day_date)||(a.sort_order??0)-(b.sort_order??0)||String(a.id).localeCompare(String(b.id))}
function showDetails(label,val){return val?`<div class="detail"><b>${label}：</b>${escapeHtml(val)}</div>`:''}
function render(){ $('days').innerHTML=dates.map(d=>`<button class="day ${d===selected?'active':''}" data-date="${d}">${d.slice(-2)}日</button>`).join(''); $('dayTitle').textContent=`12月${formatDate(selected)} · ${items.filter(i=>i.day_date===selected).length}项`;
const todays=items.filter(i=>i.day_date===selected).sort(sortItems);
$('items').innerHTML=todays.length?todays.map(i=>`<article class="item"><div class="row spread"><span class="time">${escapeHtml(i.start_time||'时间未设置')}</span><span class="chip">${escapeHtml(i.priority||'活动')}</span></div><h3>${escapeHtml(i.title||'未命名活动')}</h3><div class="muted">${escapeHtml(i.area||i.location||'')}</div>${showDetails('介绍',i.description)}${showDetails('美食',i.food)}${showDetails('交通',i.transport)}${showDetails('缓冲',i.buffer)}${showDetails('营业/确认',i.status)}${showDetails('备注',i.notes)}<div class="row actions"><button data-edit="${escapeHtml(i.id)}">编辑</button><button data-move="up" data-id="${escapeHtml(i.id)}">↑ 上移</button><button data-move="down" data-id="${escapeHtml(i.id)}">↓ 下移</button><button class="danger" data-delete="${escapeHtml(i.id)}">删除</button></div></article>`).join(''):'<div class="panel empty">当天暂无活动，可以点击「新增活动」。</div>';
const can=member?.role==='owner'||member?.role==='editor';$('addBtn').disabled=!can;document.querySelectorAll('[data-edit],[data-move],[data-delete]').forEach(b=>b.disabled=!can);
}
function setBusy(v){busy=v;$('saveBtn').disabled=v;$('loginBtn').disabled=v;}
async function init(){try{const {data:{session},error}=await supabase.auth.getSession();if(error)throw error;await onSession(session);}catch(e){notice('初始化失败：'+errorText(e),'error');toggle('login',true);}}
async function onSession(session){if(recovering)return;const seq=++loadSequence;toggle('editor',false);if(!session){trip=null;member=null;items=[];toggle('login',true);toggle('app',false);notice('请先登录。');return;}
toggle('login',false);toggle('app',true);$('userEmail').textContent=session.user.email||'已登录';notice('正在从 Supabase 读取共享行程…');try{
const {data:trips,error:te}=await supabase.from('trips').select('id,name,start_date,end_date').eq('name','Italy Trip 2026').eq('start_date','2026-12-14').eq('end_date','2026-12-22');if(te)throw te;if(seq!==loadSequence)return;if(!trips||trips.length!==1)throw new Error('找不到唯一的 Italy Trip 2026，或账号尚未被加入成员名单。');trip=trips[0];
const {data:members,error:me}=await supabase.from('trip_members').select('role').eq('trip_id',trip.id).eq('user_id',session.user.id).single();if(me)throw me;member=members;$('userRole').textContent=`旅行权限：${member.role}`;
await refresh(seq);
}catch(e){if(seq!==loadSequence)return;notice('无法读取旅行项目：'+errorText(e)+'\n请检查成员权限及 Supabase API 设置。','error');toggle('app',false);toggle('login',true);}}
async function refresh(seq=loadSequence){if(!trip)return;try{const {data,error}=await supabase.from('itinerary_items').select('*').eq('trip_id',trip.id).order('day_date',{ascending:true}).order('sort_order',{ascending:true}).range(0,999);if(error)throw error;if(seq!==loadSequence)return;items=data||[];localStorage.setItem(cacheKey,JSON.stringify({tripId:trip.id,items,savedAt:new Date().toISOString()}));render();notice(`已同步：${items.length}项行程 · ${new Date().toLocaleString('zh-CN')}`,'ok');}catch(e){if(seq!==loadSequence)return;let c=null;try{c=JSON.parse(localStorage.getItem(cacheKey)||'null')}catch{}if(c?.tripId===trip.id&&Array.isArray(c.items)){items=c.items;render();notice('目前无法连接 Supabase，显示上次缓存的行程（只读）：'+errorText(e),'error');}else{notice('同步失败：'+errorText(e),'error');} } }
function edit(item){$('editorTitle').textContent=item?'编辑活动':'新增活动';$('itemId').value=item?.id||'';$('fDate').value=item?.day_date||selected;$('fTime').value=item?.start_time||'';$('fTitle').value=item?.title||'';$('fArea').value=item?.area||item?.location||'';$('fDescription').value=item?.description||'';$('fFood').value=item?.food||'';$('fTransport').value=item?.transport||'';$('fBuffer').value=item?.buffer||'';$('fStatus').value=item?.status||'';$('fPriority').value=item?.priority||'';$('fNotes').value=item?.notes||'';toggle('editor',true);$('editor').scrollIntoView({behavior:'smooth',block:'start'});}
function getPayload(){const date=$('fDate').value;if(!dates.includes(date))throw new Error('日期必须在12月14日至22日之间。');return {day_date:date,start_time:$('fTime').value.trim(),title:$('fTitle').value.trim(),location:$('fArea').value.trim(),area:$('fArea').value.trim(),description:$('fDescription').value.trim(),food:$('fFood').value.trim(),transport:$('fTransport').value.trim(),buffer:$('fBuffer').value.trim(),status:$('fStatus').value.trim(),priority:$('fPriority').value,notes:$('fNotes').value.trim(),updated_at:new Date().toISOString()};}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;setBusy(true);notice('正在登录…');try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';}catch(e){notice('登录失败：'+errorText(e),'error')}finally{setBusy(false)}});
$('resetBtn').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){notice('请先在 Email 栏填写你的邮箱。','error');return;}try{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;notice('已请求发送重设密码邮件。请检查邮箱，并确认 Supabase 已配置对应 Redirect URL。','ok')}catch(e){notice('发送失败：'+errorText(e),'error')}});
$('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();const password=$('newPassword').value;if(password.length<8){notice('密码至少8位。','error');return;}try{const {error}=await supabase.auth.updateUser({password});if(error)throw error;recovering=false;toggle('recovery',false);$('newPassword').value='';notice('密码修改成功，正在读取共享行程…','ok');const {data:{session}}=await supabase.auth.getSession();await onSession(session);}catch(err){notice('密码修改失败：'+errorText(err),'error')}});
$('logoutBtn').addEventListener('click',async()=>{const {error}=await supabase.auth.signOut();if(error)notice('退出失败：'+errorText(error),'error')});
$('refreshBtn').addEventListener('click',()=>refresh());$('addBtn').addEventListener('click',()=>edit(null));$('cancelBtn').addEventListener('click',()=>toggle('editor',false));
$('days').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(b){selected=b.dataset.date;toggle('editor',false);render();}});
$('items').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;const id=b.dataset.edit||b.dataset.delete||b.dataset.id;const item=items.find(x=>x.id===id);if(!item)return;if(b.dataset.edit){edit(item);return;}if(b.dataset.delete){if(!confirm('确定删除这个活动吗？这只删除该行程项目，不会删除旅行消费或照片。'))return;setBusy(true);try{const {error}=await supabase.from('itinerary_items').delete().eq('id',id).eq('trip_id',trip.id);if(error)throw error;await refresh();}catch(err){notice('删除失败：'+errorText(err),'error')}finally{setBusy(false)}return;}
if(b.dataset.move){const same=items.filter(x=>x.day_date===item.day_date).sort(sortItems);const ix=same.findIndex(x=>x.id===id);const j=ix+(b.dataset.move==='up'?-1:1);if(j<0||j>=same.length)return;setBusy(true);try{ // Temporary unique ordering values; reorder by updating only two rows.
const a=same[ix],z=same[j];const aOrder=a.sort_order??ix+1,zOrder=z.sort_order??j+1;
if(aOrder===zOrder){notice('当前排序编号重复，请先刷新再试。','error');return;}
const temp=-Math.floor(Date.now()/1000);const r1=await supabase.from('itinerary_items').update({sort_order:temp}).eq('id',a.id).eq('trip_id',trip.id);if(r1.error)throw r1.error;const r2=await supabase.from('itinerary_items').update({sort_order:aOrder}).eq('id',z.id).eq('trip_id',trip.id);if(r2.error)throw r2.error;const r3=await supabase.from('itinerary_items').update({sort_order:zOrder}).eq('id',a.id).eq('trip_id',trip.id);if(r3.error)throw r3.error;await refresh();}catch(err){notice('调整顺序失败，请刷新检查：'+errorText(err),'error')}finally{setBusy(false)} }
});
$('itemForm').addEventListener('submit',async e=>{e.preventDefault();if(busy||!trip)return;setBusy(true);try{const payload=getPayload();const id=$('itemId').value;let result;if(id){result=await supabase.from('itinerary_items').update(payload).eq('id',id).eq('trip_id',trip.id);}else{const same=items.filter(x=>x.day_date===payload.day_date);payload.trip_id=trip.id;payload.sort_order=Math.max(0,...same.map(x=>Number(x.sort_order)||0))+1;result=await supabase.from('itinerary_items').insert(payload);}if(result.error)throw result.error;selected=payload.day_date;toggle('editor',false);await refresh();window.scrollTo({top:0,behavior:'smooth'});}catch(err){notice('保存失败：'+errorText(err),'error')}finally{setBusy(false)}});
$('exportBtn').addEventListener('click',()=>{const data={app:'Italy Trip 2026',type:'supabase-itinerary-backup',version:'1.7',exportedAt:new Date().toISOString(),tripId:trip?.id,itinerary:items};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Italy_Trip_2026_Shared_Backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(()=>onSession(session),0);if(event==='PASSWORD_RECOVERY'){recovering=true;toggle('login',false);toggle('app',false);toggle('recovery',true);notice('请在下方设置新密码。','ok');}});
init();
</script></body></html>

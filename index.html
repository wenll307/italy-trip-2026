    const payload={app:'Italy Trip 2026',type:'itinerary-backup',version:1,exportedAt:new Date().toISOString(),itinerary};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='Italy-Trip-2026-Itinerary-Backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(err){alert('备份失败：'+err.message)}
};
document.getElementById('importBackup').onclick=()=>{backupFile.value='';backupFile.click()};
backupFile.onchange=async()=>{
  const file=backupFile.files&&backupFile.files[0];if(!file)return;
  try{
    if(file.size>5*1024*1024)throw new Error('文件超过 5 MB，请确认是否选择正确的行程备份');
    const payload=JSON.parse(await file.text());
    if(!payload||payload.app!=='Italy Trip 2026'||payload.type!=='itinerary-backup'||payload.version!==1||!Array.isArray(payload.itinerary))throw new Error('不是本 App 支持的行程备份文件');
    const ids=new Set();
    for(const row of payload.itinerary){
      if(!row||typeof row!=='object'||Array.isArray(row)||typeof row.id!=='string'||!row.id||ids.has(row.id)||typeof row.date!=='string'||!/^2026-12-(1[4-9]|2[0-2])$/.test(row.date))throw new Error('备份内有无效或重复的行程记录');
      ids.add(row.id);
      for(const key of ['time','area','name','description','food','transport','buffer','status','priority'])if(row[key]!==undefined&&typeof row[key]!=='string')throw new Error('备份内的字段格式不正确：'+key);
    }
    if(!confirm('即将恢复 '+payload.itinerary.length+' 项行程。\\n\\n这会覆盖当前浏览器的全部9天行程（不会影响其他类型的资料）。\\n\\n建议先取消并点击「导出行程备份」保存现有资料。\\n\\n确定继续吗？'.replaceAll('\\n','\n')))return;
    const next=JSON.stringify(payload.itinerary);
    localStorage.setItem(KEY,next); // 成功写入后才更新画面
    data=payload.itinerary;window.readOnly=false;current='2026-12-14';render();
    alert('恢复成功！已载入 '+data.length+' 项行程。');
  }catch(err){alert('无法恢复，当前行程没有被替换。原因：'+err.message)}
  finally{backupFile.value=''}
};
render();
</script></body></html>
